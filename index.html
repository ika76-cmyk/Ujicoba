            // Format time Helper
            const formatTime = (seconds) => {
                const h = Math.floor(seconds / 3600);
                const m = Math.floor((seconds % 3600) / 60);
                const s = seconds % 60;
                if (h > 0) return `${h}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
            };

            // Calculate Score
            const calculateScore = () => {
                let correctCount = 0;
                allQuestions.forEach(q => {
                    const userAns = answers[q.id];
                    if (userAns === undefined) return;

                    if (q.type === 'pg') {
                        if (userAns === q.answer) correctCount++;
                    } else if (q.type === 'mcma') {
                        // Check if arrays match exactly
                        if (Array.isArray(userAns) && 
                            userAns.length === q.answers.length && 
                            userAns.every(val => q.answers.includes(val))) {
                            correctCount++;
                        }
                    } else if (q.type === 'category') {
                        // Must be all correct
                        if (userAns && typeof userAns === 'object') {
                            let allCorrect = true;
                            for (let i = 0; i < q.statements.length; i++) {
                                if (userAns[i] !== q.answers[i]) {
                                    allCorrect = false;
                                    break;
                                }
                            }
                            // Also ensure all statements were answered
                            if (allCorrect && Object.keys(userAns).length === q.statements.length) {
                                correctCount++;
                            }
                        }
                    }
                });

                const score = (correctCount * 100) / 30;
                return score.toFixed(2);
            };

            const finishTest = () => {
                setScreen('result');
            };

            // Timer effect
            useEffect(() => {
                let timer;
                if (screen === 'test' && timeLeft > 0) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                finishTest();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [screen, timeLeft]);


            // --- SCREENS ---

            if (screen === 'login') {
                return <LoginScreen setScreen={setScreen} setUserData={setUserData} userData={userData} />;
            }

            if (screen === 'popup') {
                return <PopupScreen setScreen={setScreen} userData={userData} />;
            }

            if (screen === 'result') {
                return <ResultScreen score={calculateScore()} />;
            }

            // --- TEST SCREEN ---
            const currentQuestion = allQuestions[currentIndex];

            const handleAnswerChange = (val) => {
                setAnswers(prev => ({ ...prev, [currentQuestion.id]: val }));
                // If it was doubtful and user answers, maybe clear doubtful? Left as user choice.
            };

            const toggleDoubtful = () => {
                setDoubtful(prev => ({ ...prev, [currentQuestion.id]: !prev[currentQuestion.id] }));
            };

            const handleNext = () => {
                if (currentIndex < allQuestions.length - 1) setCurrentIndex(currentIndex + 1);
            };

            const handlePrev = () => {
                if (currentIndex > 0) setCurrentIndex(currentIndex - 1);
            };

            const handleSkip = () => {
                handleNext();
            };

            return (
                <div className="flex flex-col h-screen bg-gray-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b px-6 py-3 flex justify-between items-center z-10">
                        <div className="font-bold text-lg text-gray-800 hidden sm:block">
                            UJI COBA TKA - SD CEPOKORJO 2
                        </div>
                        <div className="flex items-center space-x-4">
                            <div className="text-sm font-semibold text-gray-600">
                                {userData.name} ({userData.nisn})
                            </div>
                            <div className={`px-4 py-1.5 rounded-full font-bold text-sm flex items-center shadow-inner ${timeLeft < 300 ? 'bg-red-100 text-red-700' : 'bg-blue-50 text-blue-700'}`}>
                                ⏱️ Sisa Waktu: {formatTime(timeLeft)}
                            </div>
                        </div>
                    </header>

                    <div className="flex flex-1 overflow-hidden flex-col md:flex-row">
                        {/* Main Content Area */}
                        <main className="flex-1 overflow-y-auto p-4 md:p-8">
                            <div className="bg-white rounded-xl shadow-sm border p-6 md:p-8 max-w-4xl mx-auto">
                                <div className="mb-6 flex justify-between items-center border-b pb-4">
                                    <h2 className="text-xl font-bold text-gray-800">Soal Nomor {currentIndex + 1}</h2>
                                    <span className="text-xs font-semibold px-2 py-1 bg-gray-100 text-gray-500 rounded uppercase tracking-wider">
                                        {currentQuestion.type === 'pg' ? 'Pilihan Ganda' : currentQuestion.type === 'mcma' ? 'Pilihan Ganda Kompleks' : 'Kategori (Benar/Salah)'}
                                    </span>
                                </div>

                                <div className="font-arial-11 text-gray-800 space-y-6">
                                    {/* Stimulus */}
                                    {currentQuestion.stimulus && (
                                        <div className="bg-blue-50/50 p-4 rounded-lg border border-blue-100">
                                            <p className="leading-relaxed">{currentQuestion.stimulus}</p>
                                        </div>
                                    )}
                                    
                                    {/* Question Text */}
                                    <div className="font-semibold text-base">
                                        <p>{currentQuestion.text}</p>
                                    </div>

                                    {/* Question Input based on type */}
                                    <div className="mt-6">
                                        {currentQuestion.type === 'pg' && (
                                            <div className="space-y-3">
                                                {currentQuestion.options.map((opt, idx) => {
                                                    const letters = ['A', 'B', 'C', 'D'];
                                                    const isSelected = answers[currentQuestion.id] === idx;
                                                    return (
                                                        <label key={idx} className={`custom-radio flex items-center p-3 border rounded-lg cursor-pointer transition-colors hover:bg-gray-50 ${isSelected ? 'border-blue-500 bg-blue-50/30' : 'border-gray-200'}`}>
                                                            <input 
                                                                type="radio" 
                                                                name={`q-${currentQuestion.id}`} 
                                                                checked={isSelected}
                                                                onChange={() => handleAnswerChange(idx)}
                                                            />
                                                            <span className="marker">{letters[idx]}</span>
                                                            <span className="flex-1">{opt}</span>
                                                        </label>
                                                    )
                                                })}
                                            </div>
                                        )}

                                        {currentQuestion.type === 'mcma' && (
                                            <div className="space-y-3">
                                                {currentQuestion.options.map((opt, idx) => {
                                                    const currentAns = answers[currentQuestion.id] || [];
                                                    const isSelected = currentAns.includes(idx);
                                                    return (
                                                        <label key={idx} className={`custom-checkbox flex items-center p-3 border rounded-lg cursor-pointer transition-colors hover:bg-gray-50 ${isSelected ? 'border-blue-500 bg-blue-50/30' : 'border-gray-200'}`}>
                                                            <input 
                                                                type="checkbox" 
                                                                checked={isSelected}
                                                                onChange={(e) => {
                                                                    let newAns = [...currentAns];
                                                                    if (e.target.checked) newAns.push(idx);
                                                                    else newAns = newAns.filter(val => val !== idx);
                                                                    handleAnswerChange(newAns);
                                                                }}
                                                            />
                                                            <span className="marker"></span>
                                                            <span className="flex-1">{opt}</span>
                                                        </label>
                                                    )
                                                })}
                                            </div>
                                        )}

                                        {currentQuestion.type === 'category' && (
                                            <div className="overflow-x-auto border rounded-lg">
                                                <table className="w-full text-left border-collapse">
                                                    <thead>
                                                        <tr className="bg-gray-100 border-b text-center">
                                                            <th className="p-3 text-left">Pernyataan</th>
                                                            <th className="p-3 w-24">Benar</th>
                                                            <th className="p-3 w-24">Salah</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {currentQuestion.statements.map((stmt, idx) => {
                                                            const currentAns = answers[currentQuestion.id] || {};
                                                            return (
                                                                <tr key={idx} className="border-b last:border-0 hover:bg-gray-50 transition-colors">
                                                                    <td className="p-3">{stmt}</td>
                                                                    <td className="p-3 text-center border-l bg-white">
                                                                        <div 
                                                                            className={`category-check ${currentAns[idx] === 'Benar' ? 'checked' : ''}`}
                                                                            onClick={() => {
                                                                                handleAnswerChange({...currentAns, [idx]: 'Benar'})
                                                                            }}
                                                                        ></div>
                                                                    </td>
                                                                    <td className="p-3 text-center border-l bg-white">
                                                                        <div 
                                                                            className={`category-check ${currentAns[idx] === 'Salah' ? 'checked' : ''}`}
                                                                            onClick={() => {
                                                                                handleAnswerChange({...currentAns, [idx]: 'Salah'})
                                                                            }}
                                                                        ></div>
                                                                    </td>
                                                                </tr>
                                                            )
                                                        })}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                            
                            {/* Action Buttons Below Question */}
                            <div className="max-w-4xl mx-auto mt-6 flex justify-between items-center gap-4 flex-wrap">
                                <div className="flex gap-3 w-full sm:w-auto">
                                    <button 
                                        onClick={handlePrev}
                                        disabled={currentIndex === 0}
                                        className="px-5 py-2.5 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 disabled:opacity-50 disabled:cursor-not-allowed font-semibold shadow-sm transition-colors flex-1 sm:flex-none"
                                    >
                                        &larr; Sebelumnya
                                    </button>
                                    <button 
                                        onClick={handleSkip}
                                        className="px-5 py-2.5 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 font-semibold shadow-sm transition-colors flex-1 sm:flex-none"
                                    >
                                        Lewati
                                    </button>
                                </div>

                                <div className="flex gap-3 w-full sm:w-auto justify-end">
                                    <label className="flex items-center gap-2 cursor-pointer bg-amber-50 border border-amber-200 px-4 py-2.5 rounded-lg hover:bg-amber-100 transition-colors flex-1 sm:flex-none justify-center">
                                        <input 
                                            type="checkbox" 
                                            className="w-4 h-4 text-amber-500 accent-amber-500"
                                            checked={!!doubtful[currentQuestion.id]}
                                            onChange={toggleDoubtful}
                                        />
                                        <span className="font-semibold text-amber-700">Ragu-ragu</span>
                                    </label>

                                    {currentIndex < allQuestions.length - 1 ? (
                                        <button 
                                            onClick={handleNext}
                                            className="px-6 py-2.5 rounded-lg bg-blue-600 text-white hover:bg-blue-700 font-semibold shadow-sm transition-colors flex-1 sm:flex-none"
                                        >
                                            Selanjutnya &rarr;
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={() => {
                                                if(confirm('Apakah Anda yakin ingin menyelesaikan ujian?')) finishTest();
                                            }}
                                            className="px-8 py-2.5 rounded-lg bg-green-600 text-white hover:bg-green-700 font-bold shadow-md transition-colors flex-1 sm:flex-none"
                                        >
                                            Selesai
                                        </button>
                                    )}
                                </div>
                            </div>
                        </main>

                        {/* Sidebar Navigation */}
                        <aside className="w-full md:w-80 bg-white border-l shadow-[-4px_0_15px_rgba(0,0,0,0.03)] flex flex-col h-64 md:h-auto">
                            <div className="p-4 border-b bg-gray-50">
                                <h3 className="font-bold text-gray-700">Navigasi Soal</h3>
                                <div className="flex gap-4 mt-2 text-xs font-semibold text-gray-500">
                                    <div className="flex items-center gap-1"><span className="w-3 h-3 block bg-green-500 rounded-sm"></span> Dijawab</div>
                                    <div className="flex items-center gap-1"><span className="w-3 h-3 block bg-amber-400 rounded-sm"></span> Ragu</div>
                                    <div className="flex items-center gap-1"><span className="w-3 h-3 block bg-white border border-gray-300 rounded-sm"></span> Kosong</div>
                                </div>
                            </div>
                            <div className="p-4 overflow-y-auto flex-1">
                                <div className="grid grid-cols-5 md:grid-cols-4 lg:grid-cols-5 gap-2">
                                    {allQuestions.map((q, idx) => {
                                        const isCurrent = idx === currentIndex;
                                        const isAnswered = q.type === 'category' 
                                            ? (answers[q.id] && Object.keys(answers[q.id]).length > 0)
                                            : q.type === 'mcma'
                                                ? (answers[q.id] && answers[q.id].length > 0)
                                                : answers[q.id] !== undefined;
                                        const isDoubtful = doubtful[q.id];

                                        let bgColor = 'bg-white border-gray-300 text-gray-700'; // Default unansered
                                        if (isDoubtful) bgColor = 'bg-amber-400 border-amber-500 text-amber-900';
                                        else if (isAnswered) bgColor = 'bg-green-500 border-green-600 text-white';

                                        let ringClass = isCurrent ? 'ring-2 ring-offset-2 ring-blue-500' : '';

                                        return (
                                            <button 
                                                key={q.id}
                                                onClick={() => setCurrentIndex(idx)}
                                                className={`h-10 rounded font-bold border shadow-sm transition-all hover:opacity-80 flex items-center justify-center ${bgColor} ${ringClass}`}
                                            >
                                                {idx + 1}
                                            </button>
                                        )
                                    })}
                                </div>
                            </div>
                        </aside>
                    </div>
                </div>
            );
        };

        // --- LOGIN SCREEN COMPONENT ---
        const LoginScreen = ({ setScreen, setUserData, userData }) => {
            const [localData, setLocalData] = useState({ name: '', nisn: '', token: '' });
            const [error, setError] = useState('');

            const handleSubmit = (e) => {
                e.preventDefault();
                if (localData.token === '@1K4') {
                    setUserData(localData);
                    setScreen('popup');
                } else {
                    setError('Maaf, token yang Anda masukkan salah. Silakan ulangi Kembali.');
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center relative px-4">
                    {/* Background Pattern */}
                    <div className="absolute inset-0 bg-blue-600" style={{ backgroundImage: 'radial-gradient(#3b82f6 1px, transparent 1px)', backgroundSize: '20px 20px', opacity: 0.1 }}></div>
                    
                    <div className="bg-white p-8 md:p-12 rounded-2xl shadow-2xl max-w-md w-full relative z-10 border-t-8 border-blue-600">
                        
                        <div className="text-center mb-8">
                            {/* Placeholder Logo */}
                            <img 
                                src="https://placehold.co/100x100/blue/white?text=LOGO+SD" 
                                alt="Logo Sekolah" 
                                className="mx-auto mb-4 rounded-full shadow-md border-4 border-white"
                            />
                            
                            <h1 className="font-arial-cond text-2xl font-bold text-gray-800 leading-tight">
                                UJI COBA TES KEMAMPUAN AKADEMIK (TKA)<br/>
                                UPT SD NEGERI CEPOKORJO 2<br/>
                                TAHUN 2027
                            </h1>
                            <div className="w-16 h-1 bg-blue-500 mx-auto mt-4 rounded"></div>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-5">
                            {error && (
                                <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-semibold border border-red-200 text-center">
                                    {error}
                                </div>
                            )}
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">Nama Lengkap</label>
                                <input 
                                    type="text" 
                                    required 
                                    value={localData.name}
                                    onChange={(e) => setLocalData({...localData, name: e.target.value})}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                    placeholder="Masukkan nama Anda"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">NISN</label>
                                <input 
                                    type="text" 
                                    required 
                                    value={localData.nisn}
                                    onChange={(e) => setLocalData({...localData, nisn: e.target.value})}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                                    placeholder="Masukkan NISN"
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-1">Token Ujian</label>
                                <input 
                                    type="password" 
                                    required 
                                    value={localData.token}
                                    onChange={(e) => {
                                        setLocalData({...localData, token: e.target.value});
                                        setError('');
                                    }}
                                    className="w-full px-4 py-3 rounded-lg border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all font-mono tracking-widest"
                                    placeholder="••••"
                                />
                            </div>
                            <button 
                                type="submit" 
                                className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3.5 px-4 rounded-lg shadow-lg hover:shadow-xl transition-all mt-4"
                            >
                                Masuk Ujian
                            </button>
                        </form>
                    </div>

                    <div className="absolute bottom-4 right-6 text-gray-500 text-sm font-semibold tracking-wide bg-white/80 px-3 py-1 rounded backdrop-blur-sm">
                        Dibuat oleh: IKA YULLIANA
                    </div>
                </div>
            );
        };

        // --- POPUP SCREEN COMPONENT ---
        const PopupScreen = ({ setScreen, userData }) => {
            return (
                <div className="min-h-screen bg-gray-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden transform transition-all">
                        <div className="bg-blue-600 p-6 text-center text-white">
                            <h2 className="text-2xl font-bold">Konfirmasi Data</h2>
                            <p className="opacity-80 text-sm mt-1">Silakan periksa kembali identitas Anda</p>
                        </div>
                        
                        <div className="p-6 md:p-8">
                            <div className="bg-gray-50 rounded-xl p-4 border mb-6">
                                <table className="w-full text-left text-gray-700">
                                    <tbody>
                                        <tr>
                                            <th className="py-2 font-semibold w-1/3">Nama</th>
                                            <td className="py-2 font-bold">: {userData.name}</td>
                                        </tr>
                                        <tr>
                                            <th className="py-2 font-semibold w-1/3">NISN</th>
                                            <td className="py-2 font-bold">: {userData.nisn}</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>

                            <div className="mb-8">
                                <h3 className="font-bold text-gray-800 mb-3 text-lg flex items-center gap-2">
                                    <svg className="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    Petunjuk Pengerjaan Soal
                                </h3>
                                <ul className="space-y-3 text-gray-700 list-none font-arial-11">
                                    <li className="flex items-start gap-2">
                                        <span className="font-bold text-blue-600">a)</span> 
                                        Soal terdiri dari 30 butir soal dengan waktu mengerjakan maksimal 75 menit.
                                    </li>
                                    <li className="flex items-start gap-2">
                                        <span className="font-bold text-blue-600">b)</span> 
                                        Periksa Kembali jawaban Anda. Pastikan Anda menjawab dengan benar.
                                    </li>
                                </ul>
                                <p className="mt-4 font-bold text-center text-blue-600 text-lg">Selamat mengerjakan!</p>
                            </div>

                            <div className="flex justify-end">
                                <button 
                                    onClick={() => setScreen('test')}
                                    className="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-6 rounded-lg shadow-md transition-colors w-full sm:w-auto"
                                >
                                    Saya Mengerti, Saya Siap Mengerjakan
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // --- RESULT SCREEN COMPONENT ---
        const ResultScreen = ({ score }) => {
            return (
                <div className="min-h-screen bg-gray-50 flex items-center justify-center p-4">
                    <div className="bg-white p-8 md:p-12 rounded-3xl shadow-xl max-w-md w-full text-center border-t-8 border-green-500">
                        <div className="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                            <svg className="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                        </div>
                        
                        <h1 className="text-3xl font-bold text-gray-800 mb-2">Selamat!</h1>
                        <p className="text-gray-600 leading-relaxed mb-8">
                            Anda telah menyelesaikan Uji Coba Tes Kemampuan Akademik (TKA). Nilai yang anda dapatkan adalah
                        </p>
                        
                        <div className="bg-gradient-to-br from-green-50 to-blue-50 border border-green-100 rounded-2xl p-6 shadow-inner">
                            <div className="text-sm font-bold text-gray-500 uppercase tracking-wider mb-2">Total Nilai</div>
                            <div className="text-6xl font-black text-gray-800 tracking-tighter">
                                {score}
                            </div>
                        </div>

                        <button 
                            onClick={() => window.location.reload()}
                            className="mt-8 text-blue-600 font-semibold hover:underline"
                        >
                            Kembali ke Halaman Awal
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
